const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){const[,it,s,i,c]=P.split('.');const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(s),iterations:+it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(i)},key,ub(c)));document.open();document.write(html);document.close();}
const saved=sessionStorage.getItem('proto-pw');if(saved)open(saved).catch(()=>sessionStorage.removeItem('proto-pw'));
