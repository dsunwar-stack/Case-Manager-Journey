async function open(pw){const[,it,s,i,c]=P.split('.');const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(s),iterations:+it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
